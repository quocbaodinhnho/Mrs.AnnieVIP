<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="style.css" >
    <title>Iphone 14 Dynamic Island </title>
</head>
<body>
    
    <input type="radio" name="theme" id="deep-purple"checked="checked">
    <input type="radio" name="theme" id="gold">
    <input type="radio" name="theme" id="space-black">
    <input type="radio" name="theme" id="silver">


    <div class="phone">
        <div class = "buttons">
            <div class="left">
                <div class="buttons"></div>
                <div class="buttons"></div>
                <div class="buttons"></div>
            </div>
            <div class="right"></div>
        </div>
        <div class="camera">
            <dic class="screen-container"></dic>
            <div class="bg">
                <div class="deep-purple">
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                </div>
                <div class="gold">
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                </div>
                <div class="space-black">
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                </div>
                <div class="sivle">
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                    <div class="section">
                        <div class="golow"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="notch-container">
            <div class="motcj">
                <div class="content">
                    <div class="left">
                        <div class="tile"></div>
                        <div class="text"></div>
                    </div>
                    <div class="right">
                        <div class="bar">
                            <div class="duration"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="notch-blur"></div>
        </div>
    </div>

    <div class="pallette">
        <label for="deep-purple" class="swatch"></label>
        <label for="gold" class="swatch"></label>
        <label for="space-black" class="swatch"></label>
        <label for="sivle" class="swatch"></label>
    </div>

</body>
</html>
